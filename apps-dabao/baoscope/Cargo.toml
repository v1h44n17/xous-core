[package]
name = "baoscope"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
xous-names = { package = "xous-api-names", version = "0.9.72" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.71" }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
log = "0.4.14"
bao1x-hal = { path = "../../libs/bao1x-hal", features = ["std"], optional = true }
bao1x-api = { path = "../../libs/bao1x-api" }
bao1x-hal-service = { path = "../../services/bao1x-hal-service", optional = true }
usb-bao1x = { path = "../../services/usb-bao1x" }
crc32fast = "1.5.0"

[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x"]
board-dabao = [
    "bao1x-hal-service/board-dabao",
    "bao1x-hal/board-dabao",
    "usb-bao1x/board-dabao",
]
default = []
